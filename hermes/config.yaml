# Luca — Hermes Config

# Agent identity
agent:
  name: luca
  soul: ~/.hermes/SOUL.md
  project: ~/.hermes/luca

# LLM — ChatGPT subscription via Bankr/Codex (matches working Mac config)
# This uses the openai-codex provider that Hermes sets up when you connect ChatGPT.
# api_key_env points to whichever env var holds your ChatGPT auth token.
model:
  default: gpt-5.5
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
  api_key_env: BANKR_API_KEY

# Memory
memory:
  path: ~/.hermes/memories
  durable: MEMORY.md
  user: USER.md

# Skills
skills:
  path: ~/.hermes/skills
  active:
    - luca-finance

# Plugins (Python tools Luca can call)
plugins:
  path: ~/.hermes/luca/plugins
  active:
    - luca_core

# Environment passed to plugins
env:
  LUCA_API_BASE: http://127.0.0.1:3000
  # LUCA_TELEGRAM_USER_ID: set to the numeric Telegram sender ID for multi-user resolution.
  # The plugin calls /users/resolve to map this to a DB UUID. Falls back to LUCA_USER_ID.
  LUCA_TELEGRAM_USER_ID: ${TELEGRAM_ALLOWED_USER_ID}
  LUCA_USER_ID: ${LUCA_USER_ID}

# Telegram
telegram:
  enabled: true
  token: ${TELEGRAM_BOT_TOKEN}
  # allowed_users removed — beta access is gated by the beta_invites table in the DB.
  # Anyone can message the bot; uninvited users get a "not in beta" response.

# Monitoring
heartbeat:
  enabled: true
  interval_minutes: 10

# Materiality
materiality:
  default_usd: 50

# Security
security:
  execution: false
  read_only: true

# Logging
logging:
  level: info
  path: ~/.hermes/logs/luca.log
