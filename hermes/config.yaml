# Luca — Hermes Config

# Agent identity
agent:
  name: luca
  soul: ~/.hermes/SOUL.md
  project: ~/.hermes/luca

# LLM — OpenAI (gpt-4o-mini for classification; gpt-4o for conversation)
# To use ChatGPT subscription via GitHub Copilot OAuth: hermes model → select "GitHub Copilot"
llm:
  provider: openai
  api_key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
  context_window: 128000
  temperature: 0.2

# Memory
memory:
  path: ~/.hermes/memories
  durable: MEMORY.md
  user: USER.md

# Skills
skills:
  path: ~/.hermes/skills
  active:
    - luca-finance

# Plugins (Python tools Luca can call)
plugins:
  path: ~/.hermes/luca/plugins
  active:
    - luca_core

# Environment passed to plugins
env:
  LUCA_API_BASE: http://127.0.0.1:3000
  LUCA_USER_ID: ${LUCA_USER_ID}

# Telegram
telegram:
  enabled: true
  token: ${TELEGRAM_BOT_TOKEN}
  allowed_users:
    - ${TELEGRAM_ALLOWED_USER_ID}

# Monitoring
heartbeat:
  enabled: true
  interval_minutes: 10

# Materiality
materiality:
  default_usd: 50

# Security
security:
  execution: false
  read_only: true

# Logging
logging:
  level: info
  path: ~/.hermes/logs/luca.log
