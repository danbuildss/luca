name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: luca_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: luca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d luca_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://postgres:luca@localhost:5432/luca_test
      TEST_DATABASE_URL: postgresql://postgres:luca@localhost:5432/luca_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run verify
