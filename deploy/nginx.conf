# /etc/nginx/sites-available/luca
# Luca API — localhost only; bind nginx to loopback for internal VPS access.
# If you expose the API externally, add your domain + certbot SSL block.

server {
    listen 127.0.0.1:80;
    server_name localhost;

    # API reverse proxy
    location /api/ {
        proxy_pass         http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The API uses x-user-id for auth — only accept from localhost
        # (nginx itself is the only caller in normal operation)
        allow 127.0.0.1;
        deny  all;
    }

    # Health check — used by monitoring
    location /health {
        access_log off;
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }
}
